name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install runtime test dependencies
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi

      - name: Install root dependencies
        run: npm ci

      - name: Install agent runner dependencies
        run: npm ci --prefix agent/runner

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate generated systemd unit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/Skoobi verify % dollar\$ quote\" кириллица"
          service_home="${RUNNER_TEMP}/Home % dollar\$ quote\" slash\\ кириллица"
          node_dir="${RUNNER_TEMP}/Node % dollar\$ quote\" slash\\ кириллица"
          unit="${RUNNER_TEMP}/skoobi-ci.service"
          mkdir -p "$prefix/instances/ci" "$service_home" "$node_dir"
          cp "$(command -v node)" "$node_dir/node"
          chmod 700 "$node_dir/node"
          HOME="$service_home" PATH="$node_dir:$PATH" bash scripts/install.sh \
            --print-service linux \
            --prefix "$prefix" \
            --instance ci >"$unit"
          systemd-analyze verify --recursive-errors=no "$unit"

      - name: Check shell scripts
        run: bash -n scripts/*.sh
