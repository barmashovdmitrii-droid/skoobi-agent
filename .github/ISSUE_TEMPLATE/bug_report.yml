name: Bug report
description: Report a reproducible problem with Skoobi Agent.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, tokens, `.env` contents, auth files, private chat exports, or runtime databases.

        Report security issues privately as described in `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe reproduction you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.0.0-rc.3"
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Safe logs or output
      description: Redact tokens, IDs, private messages, and local paths.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I did not include secrets, auth/session files, or runtime data.
          required: true
        - label: I redacted private user, chat, and tenant identifiers.
          required: true
